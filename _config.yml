# Site settings. GitHub Pages reads this file when it builds the site.
# After changing it, commit and push; the site rebuilds in a minute or two.

title: Dorith Kleinstein
url: "https://dorithkleinstein.com"
email: dorithkleinstein@gmail.com

# Outside links. These stay in English.
looker_url: "https://datastudio.google.com/reporting/67893ee7-9da4-4c9b-ab32-6f7903caed08"
github_url: "https://github.com/dorithkleinstein/us-birth-outcomes-2016-2024"

# The picture shown when a page is shared on Facebook, WhatsApp or LinkedIn, by language.
# Made from share-cards/card.html. A page can use its own with an `image:` line at the top of its file.
share_image:
  he: /assets/images/card-he.png
  en: /assets/images/card-en.png
share_image_alt:
  he: "דורית קלינשטיין, Fractional Senior Analyst"
  en: "Dorith Kleinstein, Fractional Senior Analyst"

# While true, every page asks search engines not to list it.
# Set to false when the real text is in.
noindex: true

markdown: kramdown
kramdown:
  input: GFM
  # Keep quote marks exactly as typed (ארה"ב must not become curly).
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols: {}

# Articles are kept in _articles/he and _articles/en.
collections:
  articles:
    output: true

defaults:
  - scope:
      path: "_articles/he"
    values:
      layout: article
      lang: he
      permalink: /articles/:name/
  - scope:
      path: "_articles/en"
    values:
      layout: article
      lang: en
      permalink: /en/articles/:name/

exclude:
  - README.md
  - share-cards/
